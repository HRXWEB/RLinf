defaults:
  - env/realworld_f1_peg_insertion@env.train
  - env/realworld_f1_peg_insertion@env.eval
  - model/cnn_policy@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

cluster:
  num_nodes: 1
  component_placement:
    actor: 0
    env: 0
    rollout: 0

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:F1_RUN_DIR}
    project_name: rlinf
    experiment_name: ci-test
    logger_backends: [tensorboard]

  max_epochs: 2
  max_steps: 2
  weight_sync_interval: 1
  only_eval: false
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 1
  group_size: 1
  agg_q: min
  actor_agg_q: mean
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: token-mean
  bootstrap_type: always
  gamma: 0.8
  tau: 0.01

  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 0.01
    target_entropy: -16
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  replay_buffer:
    enable_cache: true
    cache_size: 200
    sample_window_size: 200
    min_buffer_size: 1
    auto_save: false

  target_update_freq: 1

env:
  group_name: EnvGroup

  train:
    rollout_epoch: 1
    total_num_envs: 1
    override_cfg:
      is_dummy: true

  eval:
    rollout_epoch: 1
    total_num_envs: 1
    override_cfg:
      is_dummy: true

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: false

  model:
    model_path: ${oc.env:F1_MODEL_PATH}
    precision: ${actor.model.precision}

  enable_torch_compile: true
  enable_cuda_graph: false

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 8
  global_batch_size: 8
  seed: 1234
  enable_offload: false

  model:
    model_path: ${oc.env:F1_MODEL_PATH}
    state_dim: 16
    action_dim: 16
    image_num: 3

  optim:
    clip_grad: 10.0
    lr: 3.0e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 3.0e-4
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false

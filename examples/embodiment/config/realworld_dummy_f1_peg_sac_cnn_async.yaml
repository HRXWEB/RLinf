defaults:
  - env/realworld_f1_peg_insertion@env.train
  - env/realworld_f1_peg_insertion@env.eval
  - model/cnn_policy@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0
    env: 0
    rollout: 0

runner:
  task_type: embodied
  logger:
    log_path: ./logs/f1-peg-fake-sac
    project_name: rlinf
    experiment_name: f1_peg_fake_sac_cnn_async
    logger_backends: [tensorboard]

  max_epochs: 10
  max_steps: 2
  weight_sync_interval: 1
  only_eval: false
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 1
  group_size: 1
  agg_q: min
  actor_agg_q: mean
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: token-mean
  bootstrap_type: always
  gamma: 0.8
  tau: 0.01
  initial_random_steps: 0

  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 0.01
    target_entropy: -14
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  replay_buffer:
    enable_cache: true
    cache_size: 200
    sample_window_size: 200
    min_buffer_size: 1
    auto_save: false

  f1_replay:
    enabled: true

  target_update_freq: 1

env:
  group_name: EnvGroup

  train:
    action_dim: 14
    action_schema: f1-normalized-action-v1
    rollout_epoch: 1
    total_num_envs: 1
    max_episode_steps: 10
    max_steps_per_rollout_epoch: 10
    override_cfg:
      controller: &fake_controller
        backend: fake
        control_period_s: 0.001
        max_observation_age_s: 0.25
        max_observation_skew_s: 0.05
        fake:
          seed: 7
          image_height: 32
          image_width: 48
          command_latency_s: 0.0
          command_history_limit: 32
      action_scale: &f1_action_scale
        tcp_position_m: 0.005
        tcp_orientation_deg: 1.0
        gripper_percent_closed: 10.0
      motion_envelope: &f1_motion_envelope
        left_arm:
          tcp:
            max_delta:
              position_m: 0.005
              orientation_deg: 1.0
            workspace_bounds:
              position_m:
                x: {min: -1.0, max: 1.0}
                y: {min: -1.0, max: 1.0}
                z: {min: -1.0, max: 1.0}
              orientation_deg:
                rx: {min: -180.0, max: 180.0}
                ry: {min: -180.0, max: 180.0}
                rz: {min: -180.0, max: 180.0}
        right_arm:
          tcp:
            max_delta:
              position_m: 0.005
              orientation_deg: 1.0
            workspace_bounds:
              position_m:
                x: {min: -1.0, max: 1.0}
                y: {min: -1.0, max: 1.0}
                z: {min: -1.0, max: 1.0}
              orientation_deg:
                rx: {min: -180.0, max: 180.0}
                ry: {min: -180.0, max: 180.0}
                rz: {min: -180.0, max: 180.0}
        gripper_percent_closed: [0.0, 100.0]
      max_num_steps: 10

  eval:
    action_dim: 14
    action_schema: f1-normalized-action-v1
    rollout_epoch: 1
    total_num_envs: 1
    max_episode_steps: 10
    max_steps_per_rollout_epoch: 10
    override_cfg:
      controller: *fake_controller
      action_scale: *f1_action_scale
      motion_envelope: *f1_motion_envelope
      max_num_steps: 10

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: false

  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}
    action_dim: 14
    image_num: 3
    num_q_heads: 10

  enable_torch_compile: true
  enable_cuda_graph: false

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 8
  global_batch_size: 8
  seed: 1234
  enable_offload: false

  model:
    model_path: /path/to/RLinf-ResNet10-pretrained
    state_dim: 16
    action_dim: 14
    image_num: 3
    num_q_heads: 10

  optim:
    clip_grad: 10.0
    lr: 3.0e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 3.0e-4
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
